<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>NYÚL | nyúl-ON-tool</title>
<style>
  :root {
    --fg: wheat;
    --dim: #8a7f66;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: black;
    color: var(--fg);
    font-family: monospace;
    display: flex;
    flex-direction: column;
    -webkit-text-size-adjust: 100%;
  }

  /* back button | centered title | invisible spacer of equal width */
  .title {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    font-size: clamp(1.4rem, 6vw, 2rem);
    padding: 16px 10px;
  }

  .back {
    justify-self: start;
    color: inherit;
    text-decoration: none;
    font-size: 2.2rem;
    line-height: 1;
    padding: 6px 16px;
    -webkit-tap-highlight-color: transparent;
  }

  .back:hover, .back:active { color: #fff; }

  .article-title {
    margin: 0;
    padding: 8px 12px 10px;
    font-size: 1.1rem;
    font-weight: normal;
    text-align: left;
  }

  .article-title::before {
    content: "> ";
    color: var(--dim);
  }

  .gif-container {
    flex: 1;
    display: flex;
    min-height: 40vh;
  }

  img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .footer {
    text-align: center;
    color: var(--dim);
    padding: 12px 10px 16px;
  }

  .footer pre {
    display: inline-block;
    margin: 0;
    font-family: monospace;
    font-size: .75rem;
    line-height: 1.1;
    text-align: left;
  }
</style>
</head>
<body>

  <div class="title">
    <a class="back" href="../" aria-label="Vissza">&larr;</a>
    <span>-= nyúl-ON-tool =-</span>
    <span></span>
  </div>

  <h1 class="article-title">NYÚL</h1>

  <div class="gif-container">
    <img src="../nyul.gif" alt="Nyúl">
  </div>

  <footer class="footer" aria-label="nyúl"><pre>(\_/)
(o.o)
(&gt; &lt;)</pre></footer>

</body>
</html>
