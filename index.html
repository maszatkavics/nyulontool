<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>nyulontool.hu</title>
<style>
  :root {
    --bg: #000;
    --fg: wheat;
    --dim: #8a7f66;
    --line: #2a2418;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: monospace;
    -webkit-text-size-adjust: 100%;
  }

  .title {
    text-align: center;
    font-size: clamp(1.4rem, 6vw, 2rem);
    padding: 16px 10px;
    background: var(--bg);
  }

  .feed {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 8px 12px 32px;
  }

  @media (min-width: 640px) {
    .feed { grid-template-columns: repeat(2, 1fr); gap: 20px; }
  }
  @media (min-width: 960px) {
    .feed { grid-template-columns: repeat(3, 1fr); }
  }

  .card {
    display: block;
    color: inherit;
    text-decoration: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    background: #0a0a0a;
    -webkit-tap-highlight-color: transparent;
    transition: border-color .15s, transform .15s;
  }

  .card:hover, .card:focus-visible, .card:active {
    border-color: var(--fg);
    outline: none;
  }

  .card:active { transform: scale(.98); }

  .cover {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
  }

  .meta {
    padding: 10px 12px 12px;
  }

  .meta h2 {
    margin: 0;
    font-size: 1.1rem;
    font-weight: normal;
  }

  .meta h2::before {
    content: "> ";
    color: var(--dim);
  }

  .footer {
    text-align: center;
    color: var(--dim);
    padding: 12px 10px 16px;
  }

  .egg {
    display: inline-block;
    color: inherit;
    text-decoration: none;
    padding: 6px 14px;
    -webkit-tap-highlight-color: transparent;
  }

  .egg:active { color: var(--fg); }

  .footer pre {
    display: inline-block;
    margin: 0;
    font-family: monospace;
    font-size: .75rem;
    line-height: 1.1;
    text-align: left;
  }
</style>
</head>
<body>

  <div class="title">-= nyúl-ON-tool =-</div>

  <main class="feed">
    <a class="card" href="spoon/">
      <img class="cover" src="spoon/tile-0.jpg" alt="SPOON">
      <div class="meta"><h2>SPOON</h2></div>
    </a>
  </main>

  <footer class="footer" aria-label="nyúl"><a class="egg" href="nyul/"><pre>(\_/)
(o.o)
(&gt; &lt;)</pre></a></footer>

</body>
</html>
